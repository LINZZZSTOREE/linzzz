<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Email — LINZZZSTOREE</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Verifikasi <span>Email</span></h1>
      <p class="auth-sub">Kode verifikasi telah dikirim ke <br><b id="verifyEmailLabel">-</b></p>

      <form id="verifyForm">
        <div class="otp-boxes">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
        </div>

        <div class="form-msg" id="verifyMsg" style="text-align:center;"></div>
        <button type="submit" class="btn btn-primary auth-submit">Verifikasi</button>
      </form>

      <div class="auth-foot">
        Tidak menerima kode? <a href="#" id="resendOtpBtn">Kirim ulang</a>
      </div>
      <div class="auth-foot"><a href="signup.html">&larr; Kembali</a></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
