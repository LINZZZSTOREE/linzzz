<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — LINZZZSTOREE</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Welcome to <span>linzzzstoree</span></h1>
      <p class="auth-sub">Buat akun baru</p>

      <form id="signupForm">
        <div class="field">
          <label>Username</label>
          <div class="field-input">
            <input type="text" id="signupUsername" placeholder="Masukkan username" autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="field-input">
            <input type="password" id="signupPassword" placeholder="Masukkan password" autocomplete="new-password">
            <svg id="signupEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label>Konfirmasi Password</label>
          <div class="field-input">
            <input type="password" id="signupConfirmPassword" placeholder="Ulangi password" autocomplete="new-password">
            <svg id="confirmEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label>Email</label>
          <div class="field-input">
            <input type="email" id="signupEmail" placeholder="nama@email.com" autocomplete="email">
          </div>
        </div>

        <div class="form-msg" id="signupMsg"></div>
        <button type="submit" class="btn btn-primary auth-submit">Sign Up</button>
      </form>

      <div class="auth-foot">Sudah punya akun? <a href="login.html">Login</a></div>
      <div class="auth-foot"><a href="index.html">&larr; Kembali ke beranda</a></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
