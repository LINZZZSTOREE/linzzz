<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — LINZZZSTOREE</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Admin <span>Panel</span></h1>
      <p class="auth-sub">linzzzstoree control center</p>

      <form id="adminLoginForm">
        <div class="field">
          <label>Username</label>
          <div class="field-input">
            <input type="text" id="adminUsername" placeholder="Username admin" autocomplete="off">
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="field-input">
            <input type="password" id="adminPassword" placeholder="Password admin" autocomplete="off">
          </div>
        </div>
        <div class="form-msg" id="adminLoginMsg"></div>
        <button type="submit" class="btn btn-primary auth-submit">Masuk</button>
      </form>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
