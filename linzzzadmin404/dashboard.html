<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — LINZZZSTOREE</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-head">
        <span class="brand" style="font-size:15px;">LINZZZ<span>ADMIN</span></span>
      </div>
      <a class="nav-item" href="#" onclick="showSection('overview')">Overview</a>
      <a class="nav-item" href="#" onclick="showSection('otp')">Email OTP</a>
      <a class="nav-item" href="#" id="adminLogoutBtn">Logout</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <button class="icon-btn" id="adminHamburgerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h2 style="margin:0;">Dashboard Admin</h2>
      </div>

      <section id="section-overview">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">Total Login Sukses</div>
            <div class="value" id="statLoginSuccess">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Permintaan Email (OTP)</div>
            <div class="value" id="statEmailRequests">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Total Pengunjung</div>
            <div class="value" id="statVisitors">0</div>
          </div>
          <div class="stat-card">
            <div class="label">Waktu Server</div>
            <div class="value" id="statTime" style="font-size:16px;">-</div>
          </div>
        </div>
      </section>

      <section id="section-otp" style="display:none;">
        <div class="panel">
          <h3>Email OTP Masuk</h3>
          <table>
            <thead>
              <tr><th>Username</th><th>Email</th><th>Jumlah OTP</th><th>Terverifikasi</th><th>Aksi</th></tr>
            </thead>
            <tbody id="otpTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
