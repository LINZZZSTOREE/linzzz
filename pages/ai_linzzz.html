<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <title>AI By Linzzz - LINZZZSTOREE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/ai_linzzz.css?v=1">
</head>
<body>
<header class="header">
  <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
  <a href="../index.html" class="brand">LINZZZSTOREE</a>
  <div class="ai-status"><span></span>AI</div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-brand">LINZZZSTOREE</span>
    <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <nav class="sidebar-menu">
    <a href="../index.html" class="sidebar-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="digital_store.html" class="sidebar-link"><i class="fa-solid fa-store"></i><span>Digital Store</span></a>
    <a href="ai_linzzz.html" class="sidebar-link active"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI By Linzzz</span></a>
    <a href="info.html" class="sidebar-link"><i class="fa-solid fa-circle-info"></i><span>Info</span></a>
  </nav>
</aside>
<main class="ai-main">
  <section class="welcome-state" id="welcomeState">
    <div class="welcome-orb"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <span class="welcome-label">AI BY LINZZZ</span>
    <h1>Selamat datang di AI LINZZZSTOREE,<br><span>ada yang bisa saya bantu?</span></h1>
    <p>Tanyakan apa saja. Saat ini menggunakan model GPTOSS-20B.</p>
  </section>
  <section class="chat-list" id="chatList" aria-live="polite"></section>
</main>
<div class="composer-wrap">
  <div class="composer">
    <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Tulis pesan..."></textarea>
    <div class="composer-bottom">
      <button class="model-button" id="modelButton" type="button"><i class="fa-solid fa-microchip"></i><span>GPTOSS-20B</span><i class="fa-solid fa-chevron-up"></i></button>
      <button class="send-button" id="sendButton" type="button"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>
  <p class="ai-disclaimer">AI dapat membuat kesalahan. Periksa informasi penting.</p>
</div>
<div class="model-overlay" id="modelOverlay">
  <div class="model-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><div><small>Model</small><h2>Pilih Model AI</h2></div><button id="closeModelSheet"><i class="fa-solid fa-xmark"></i></button></div>
    <button class="model-option active" type="button">
      <div class="model-icon"><i class="fa-solid fa-microchip"></i></div><div class="model-text"><strong>GPTOSS-20B</strong><span>Terhubung • OpenRouter</span></div><div class="check"><i class="fa-solid fa-check"></i></div>
    </button>
    <button class="model-option disabled" type="button" disabled>
      <div class="model-icon muted"><i class="fa-solid fa-bolt"></i></div><div class="model-text"><strong>LINZZZ AI</strong><span>Tidak terhubung</span></div><div class="offline">Offline</div>
    </button>
  </div>
</div>
<script src="../assets/js/config.js?v=4"></script>
<script src="../assets/js/ai_linzzz.js?v=1"></script>
</body>
</html>
