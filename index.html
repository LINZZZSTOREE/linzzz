<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINZZZSTOREE — WhatsApp Bot</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Overlay untuk sidebar & popup -->
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand" style="font-size:16px;">LINZZZ<span>STOREE</span></span>
      <button class="icon-btn" onclick="closeSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <a class="nav-item" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      Beranda
    </a>
    <a class="nav-item" href="bot-free.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      Bot WhatsApp Free
    </a>
    <a class="nav-item" href="login.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      Login
    </a>
  </aside>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="hamburgerBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="brand topbar-title">LINZZZ<span>STOREE</span></span>
    </div>

    <div class="topbar-right">
      <div id="authArea" style="display:flex; gap:10px;"></div>

      <button class="icon-btn" id="accountBtn" title="Akun">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>

      <div class="account-pop" id="accountPop">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="email" id="accountEmail">user@gmail.com</div>
        <div class="status" id="accountStatus">Belum login</div>
        <button class="btn" id="logoutBtn" style="display:none; width:100%; margin-top:6px;">Logout</button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="container">
    <div class="hero">
      <h1>Layanan Bot WhatsApp</h1>
      <p>Pilih paket bot WhatsApp yang sesuai kebutuhanmu.</p>
    </div>

    <div class="grid-cards">
      <div class="service-card">
        <span class="badge">FREE</span>
        <h3>Bot WhatsApp Free</h3>
        <ul>
          <li>Status: Free</li>
          <li>Fitur terbatas</li>
          <li>Durasi 24 Jam</li>
        </ul>
        <button class="btn btn-primary try-btn" id="tryFreeBtn">Coba sekarang</button>
      </div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
